name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check syntax
        run: |
          for script in .github/scripts/*.sh; do bash -n "$script"; done
          find root -type f \( -name '*.sh' -o -path '*/init.d/*' -o -path '*/libexec/rpcd/*' -o -name 'honk-panel-worker' \) -exec sh -n {} \;
          node --check htdocs/luci-static/resources/view/honk/panel.js
